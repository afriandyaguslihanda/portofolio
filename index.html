<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Portofolio | Afriandy Agus Lihanda</title>

  <link
    rel="stylesheet"
    href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap"
  >
  <link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
  >

  <style>
    :root {
      color-scheme: dark;
      --bg: #020617;
      --panel: #0a1c2c;
      --edge: #29495c;
      --text: #e5e7eb;
      --primary: #38bdf8;
      --signal: #6ce4fa;
      --cyan: #67d9ff;
      --ice: #d9f2ff;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      min-height: 100svh;
      display: grid;
      place-items: center;
      padding: 24px 16px;
      background:
        radial-gradient(ellipse at 80% 20%, #11628b36, transparent 48%),
        var(--bg);
      color: var(--text);
      font-family: "Poppins", Arial, sans-serif;
    }

    .card {
      width: min(100%, 390px);
      padding: 32px 24px;
      text-align: center;
      background: var(--panel);
      border: 1px solid var(--edge);
      border-radius: 20px;
      box-shadow: 0 15px 40px rgb(0 0 0 / 40%);
    }

    /* Foto profil */
    .portrait {
      position: relative;
      display: grid;
      place-items: center;
      width: 120px;
      height: 120px;
      margin: 0 auto 16px;
      overflow: hidden;
      border: 4px solid var(--cyan);
      border-radius: 50%;
      background: linear-gradient(140deg, #1b465e, #0b2231);
      color: var(--ice);
      font-size: 32px;
      font-weight: 600;
      box-shadow: 0 0 18px rgb(56 189 248 / 18%);
    }

    .profile-img {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    /* Nama dan deskripsi */
    h1 {
      margin: 0;
      font-size: 1.45rem;
      line-height: 1.3;
      color: var(--ice);
    }

    @supports (background-clip: text) {
      h1 {
        background: linear-gradient(110deg, var(--cyan), var(--ice));
        background-clip: text;
        color: transparent;
      }
    }

    p {
      margin: 10px auto 22px;
      font-size: 1rem;
      line-height: 1.6;
    }

    a {
      text-decoration: none;
    }

    /* Tombol portofolio */
    .about-btn {
      display: inline-block;
      padding: 12px 22px;
      border-radius: 30px;
      background: linear-gradient(135deg, var(--primary), var(--signal));
      color: var(--bg);
      font-size: 0.9rem;
      font-weight: 600;
    }

    .about-btn:hover {
      box-shadow: 0 8px 24px rgb(56 189 248 / 30%);
    }

    /* Media sosial */
    .socials {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 8px;
      margin-top: 16px;
    }

    .socials a {
      padding: 9px 12px;
      border: 1px solid var(--edge);
      border-radius: 30px;
      background: #0b2231;
      color: var(--ice);
      font-size: 0.875rem;
    }

    .socials a:hover {
      background: var(--primary);
      color: var(--bg);
    }

    a:focus-visible {
      outline: 2px solid var(--signal);
      outline-offset: 4px;
    }

    /* Animasi mengikuti preferensi gerakan pengunjung */
    @media (prefers-reduced-motion: no-preference) {
      .card {
        animation: float 4s ease-in-out infinite;
      }

      .card:hover,
      .card:focus-within {
        animation-play-state: paused;
      }

      a {
        transition:
          transform 0.25s,
          background-color 0.25s,
          box-shadow 0.25s;
      }

      a:hover {
        transform: translateY(-2px);
      }

      @keyframes float {
        50% {
          transform: translateY(-8px);
        }
      }
    }
  </style>
</head>

<body>
  <main class="card">
    <!-- Untuk mengganti foto, ubah alamat pada src. -->
    <div class="portrait">
      <span aria-hidden="true">AAL</span>
      <img
        class="profile-img"
        src="img/FOTOPROFILGUA1.jpeg"
        alt="Foto Afriandy Agus Lihanda"
        onerror="this.onerror = () => this.remove(); this.src = 'https://raw.githubusercontent.com/afriandyaguslihanda/portofolio/main/img/FOTOPROFILGUA1.jpeg';"
      >
    </div>

    <h1>Afriandy Agus Lihanda</h1>

    <p>
      Seorang lulusan Sarjana Ilmu Politik yang memiliki ketertarikan
      di bidang wirausaha dan olahraga.
    </p>

    <a class="about-btn" href="https://lebihlanjut.vercel.app/">
      Tentang Afriandy Lebih Lanjut
    </a>

    <nav class="socials" aria-label="Media sosial">
      <a
        href="https://www.instagram.com/afriandyal/"
        target="_blank"
        rel="noopener"
      >
        <i class="fab fa-instagram" aria-hidden="true"></i>
        Instagram
      </a>

      <a
        href="https://www.tiktok.com/@afriandyagus"
        target="_blank"
        rel="noopener"
      >
        <i class="fab fa-tiktok" aria-hidden="true"></i>
        TikTok
      </a>

      <a
        href="https://www.linkedin.com/in/afriandy-agus-lihanda"
        target="_blank"
        rel="noopener"
      >
        <i class="fab fa-linkedin" aria-hidden="true"></i>
        LinkedIn
      </a>
    </nav>
  </main>
</body>
</html>
